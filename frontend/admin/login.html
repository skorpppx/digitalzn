<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital ZN | Business Suite</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="background"></div>

<div class="login-card">

    <div class="logo">

        <h1>Digital ZN</h1>

        <p>Business Suite</p>

    </div>

    <h2>Administrator Login</h2>

    <form id="login-form">

        <input
            id="email"
            type="email"
            placeholder="Email"
            required
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            required
        >

        <button type="submit">

            Sign In

        </button>

    </form>

    <p id="error"></p>

</div>

<script src="login.js"></script>

</body>

</html>
